name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    env:
      HUSKY: 0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - run: pnpm typecheck
      - run: git diff --exit-code -- src/app/router/routeTree.gen.ts
      - run: pnpm test:tooling
      - run: pnpm check:fsd
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      # 브라우저는 캐시에서 왔어도 시스템 라이브러리는 러너마다 새로 깔아야 한다.
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm test
      - uses: docker/setup-buildx-action@v3
      - name: Build check image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: bcsd-internal-frontend:check
          cache-from: type=gha,scope=check
          cache-to: type=gha,scope=check,mode=max
      - run: python3 scripts/verify-nginx.py bcsd-internal-frontend:check

  # 배포 이미지는 검증과 동시에 만들어 커밋 SHA 태그로만 올린다. latest와 서버 반영은
  # verify가 통과한 뒤 deploy 작업이 맡는다. PR에서는 arm64 빌드가 되는지만 보고 올리지 않는다.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          platforms: linux/arm64
          tags: ghcr.io/bcsdlab/bcsd-internal-frontend:${{ github.sha }}
          cache-from: type=gha,scope=deploy-arm64
          cache-to: type=gha,scope=deploy-arm64,mode=max

  deploy:
    if: github.event_name == 'push'
    needs: [verify, image]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag verified image as latest
        run: >-
          docker buildx imagetools create
          --tag ghcr.io/bcsdlab/bcsd-internal-frontend:latest
          ghcr.io/bcsdlab/bcsd-internal-frontend:${{ github.sha }}
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_IMAGE: ghcr.io/bcsdlab/bcsd-internal-frontend:${{ github.sha }}
          API_ORIGIN: ${{ secrets.API_ORIGIN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_IMAGE,API_ORIGIN,GHCR_TOKEN,GHCR_USER
          script: |
            set -eu
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$DEPLOY_IMAGE"
            name=bcsd-internal-frontend
            previous=bcsd-internal-frontend-previous
            if docker container inspect "$previous" >/dev/null 2>&1; then
              echo "Previous rollback container exists; inspect it before deploying."
              exit 1
            fi
            rollback() {
              docker rm -f "$name" || true
              if docker container inspect "$previous" >/dev/null 2>&1; then
                docker rename "$previous" "$name"
                docker start "$name"
              fi
            }
            if docker container inspect "$name" >/dev/null 2>&1; then
              docker stop "$name"
              docker rename "$name" "$previous"
            fi
            trap rollback EXIT
            docker run -d \
              --name "$name" \
              --restart unless-stopped \
              --network bcsdlab-internal_default \
              -p 127.0.0.1:3000:3000 \
              -e API_ORIGIN="${API_ORIGIN:-http://bcsd-internal-api:8081}" \
              --memory=256m \
              "$DEPLOY_IMAGE"
            healthy=false
            for attempt in $(seq 1 30); do
              if [ "$(docker inspect --format '{{.State.Health.Status}}' "$name")" = healthy ]; then
                healthy=true
                break
              fi
              sleep 2
            done
            [ "$healthy" = true ]
            curl --fail --silent http://127.0.0.1:3000/games/1 >/dev/null
            trap - EXIT
            docker rm "$previous" || true
