name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    env:
      HUSKY: 0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: git diff --exit-code -- src/app/router/routeTree.gen.ts
      - run: pnpm test:tooling
      - run: pnpm check:fsd
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - run: docker build -t bcsd-internal-frontend:check .
      - run: python3 scripts/verify-nginx.py bcsd-internal-frontend:check

  build-and-deploy:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ghcr.io/bcsdlab/bcsd-internal-frontend:${{ github.sha }}
            ghcr.io/bcsdlab/bcsd-internal-frontend:latest
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_IMAGE: ghcr.io/bcsdlab/bcsd-internal-frontend:${{ github.sha }}
          API_ORIGIN: ${{ secrets.API_ORIGIN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_IMAGE,API_ORIGIN,GHCR_TOKEN,GHCR_USER
          script: |
            set -eu
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$DEPLOY_IMAGE"
            name=bcsd-internal-frontend
            previous=bcsd-internal-frontend-previous
            if docker container inspect "$previous" >/dev/null 2>&1; then
              echo "Previous rollback container exists; inspect it before deploying."
              exit 1
            fi
            rollback() {
              docker rm -f "$name" || true
              if docker container inspect "$previous" >/dev/null 2>&1; then
                docker rename "$previous" "$name"
                docker start "$name"
              fi
            }
            if docker container inspect "$name" >/dev/null 2>&1; then
              docker stop "$name"
              docker rename "$name" "$previous"
            fi
            trap rollback EXIT
            docker run -d \
              --name "$name" \
              --restart unless-stopped \
              --network bcsdlab-internal_default \
              -p 127.0.0.1:3000:3000 \
              -e API_ORIGIN="${API_ORIGIN:-http://bcsd-internal-api:8081}" \
              --memory=256m \
              "$DEPLOY_IMAGE"
            healthy=false
            for attempt in $(seq 1 30); do
              if [ "$(docker inspect --format '{{.State.Health.Status}}' "$name")" = healthy ]; then
                healthy=true
                break
              fi
              sleep 2
            done
            [ "$healthy" = true ]
            curl --fail --silent http://127.0.0.1:3000/games/1 >/dev/null
            trap - EXIT
            docker rm "$previous" || true
